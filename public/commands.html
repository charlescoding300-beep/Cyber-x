<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07120e"><title>ZEN X | Command Center</title>
<style>
:root{color-scheme:dark;--bg:#07120e;--panel:#0f1d17;--panel2:#12251c;--green:#35dc83;--muted:#9db3a6;--line:#203a2d;--white:#f0f7f2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#174631 0,transparent 48%),var(--bg);color:var(--white);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:52px 22px 76px}header{margin-bottom:30px}.eyebrow{color:var(--green);font-size:.76rem;letter-spacing:.18em;font-weight:800;text-transform:uppercase}h1{font-size:clamp(2.4rem,7vw,4.5rem);letter-spacing:-.055em;line-height:1.02;margin:10px 0 12px}header p{color:var(--muted);max-width:650px;margin:0 0 24px;font-size:1.05rem}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.toolbar input{background:#0b1812;border:1px solid var(--line);border-radius:13px;color:#fff;padding:13px 16px;min-width:min(100%,340px);font:inherit;outline:none}.toolbar input:focus{border-color:var(--green);box-shadow:0 0 0 3px #35dc8320}.count{color:var(--muted);font-size:.9rem}.filters{display:flex;gap:8px;overflow:auto;padding:18px 0 2px;scrollbar-width:thin}.filter{border:1px solid var(--line);border-radius:999px;background:#0c1912;color:#c6d9cd;padding:8px 13px;white-space:nowrap;cursor:pointer;font:inherit;font-size:.86rem}.filter.active,.filter:hover{background:#153c28;border-color:#267348;color:#fff}.section{margin-top:32px}.section-head{display:flex;align-items:center;gap:12px;margin:0 0 15px}.section-head h2{font-size:1.2rem;letter-spacing:.12em;margin:0;text-transform:uppercase}.section-head .rule{height:1px;background:var(--line);flex:1}.section-count{font-size:.82rem;color:var(--muted)}.subsection{margin:19px 0 0}.subhead{margin:0 0 10px;color:#a8c4b1;font-size:.82rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}.card{background:linear-gradient(145deg,#11231a,#0c1711);border:1px solid var(--line);border-radius:15px;padding:16px;min-width:0;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#347451}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.name{font-size:1.06rem;font-weight:800;overflow-wrap:anywhere}.badge{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--green);background:#163522;border:1px solid #26583a;border-radius:999px;padding:3px 8px;white-space:nowrap}.desc{color:var(--muted);min-height:44px;margin:10px 0 13px}.usage{font: .82rem/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;color:#d7eee0;background:#08110c;padding:9px 10px;border-radius:8px}.aliases{color:#7f9a89;font-size:.78rem;margin-top:9px}.empty{color:var(--muted);padding:30px 0}footer{color:var(--muted);font-size:.85rem;margin-top:40px;border-top:1px solid var(--line);padding-top:18px}a{color:var(--green)}@media(max-width:560px){.wrap{padding:36px 16px 56px}.section-head h2{font-size:1.05rem}}
</style>
</head>
<body><main class="wrap"><header><div class="eyebrow">ZEN X BOT · COMMAND CENTER</div><h1>Find your command.</h1><p>Explore bot features by category. Search by command name, description, or usage, then copy a command into WhatsApp.</p><div class="toolbar"><input id="search" type="search" placeholder="Search commands…" aria-label="Search commands"><span id="count" class="count">Loading commands…</span></div><nav id="filters" class="filters" aria-label="Command categories"></nav></header><div id="sections" aria-live="polite"></div><footer>Use the bot’s configured prefix. Default prefix: <code>.</code> &nbsp; <a href="/pair">Pair a WhatsApp account</a></footer></main>
<script>
const sections=document.getElementById('sections'),search=document.getElementById('search'),count=document.getElementById('count'),filters=document.getElementById('filters');let commands=[],active='All';
const groups=[{name:'Fun',categories:['fun','games','entertainment']},{name:'Communities',categories:['group','group/admin']},{name:'AI',categories:['ai']},{name:'Tools',categories:['utility','search']},{name:'Downloads',categories:['download']},{name:'Media',categories:['media','sticker','soundeffect']},{name:'General',categories:['general']}];
function parentFor(category){return groups.find(g=>g.categories.includes(category))?.name||'Other'}
function subgroupFor(category){return ({games:'Games',fun:'Fun',entertainment:'Fun','group/admin':'Admin Tools',group:'Group Management',soundeffect:'Audio Effects',sticker:'Stickers',media:'Voice & Media',utility:'Utilities',search:'Search',download:'Downloads',general:'General',ai:'AI'})[category]||'More'}
function draw(){const q=search.value.trim().toLowerCase();const shown=commands.filter(c=>{const parent=parentFor(c.category);return(active==='All'||parent===active)&&(c.name+' '+c.description+' '+c.usage+' '+c.category+' '+parent+' '+subgroupFor(c.category)).toLowerCase().includes(q)});count.textContent=shown.length+' of '+commands.length+' commands';sections.replaceChildren();filters.replaceChildren();const all=[{name:'All',categories:[]} ,...groups.filter(g=>commands.some(c=>g.categories.includes(c.category)))];for(const g of all){const b=document.createElement('button');b.className='filter'+(active===g.name?' active':'');b.type='button';b.textContent=g.name+(g.name==='All'?'':' · '+shown.filter(c=>parentFor(c.category)===g.name).length);b.onclick=()=>{active=g.name;draw()};filters.append(b)}if(!shown.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching commands.';sections.append(p);return}const ordered=[...groups.map(g=>g.name),'Other'];for(const parent of ordered){const members=shown.filter(c=>parentFor(c.category)===parent);if(!members.length)continue;const section=document.createElement('section');section.className='section';const head=document.createElement('div');head.className='section-head';const h=document.createElement('h2');h.textContent=parent;const rule=document.createElement('span');rule.className='rule';const n=document.createElement('span');n.className='section-count';n.textContent=members.length+' commands';head.append(h,rule,n);section.append(head);const subs=[...new Set(members.map(c=>subgroupFor(c.category)))];for(const sub of subs){const subset=members.filter(c=>subgroupFor(c.category)===sub);const subsection=document.createElement('div');subsection.className='subsection';const sh=document.createElement('h3');sh.className='subhead';sh.textContent=sub;const grid=document.createElement('div');grid.className='grid';for(const c of subset){const card=document.createElement('article');card.className='card';const top=document.createElement('div');top.className='top';const name=document.createElement('span');name.className='name';name.textContent='.'+c.name;const badge=document.createElement('span');badge.className='badge';badge.textContent=sub;top.append(name,badge);const desc=document.createElement('p');desc.className='desc';desc.textContent=c.description;const usage=document.createElement('div');usage.className='usage';usage.textContent=c.usage;card.append(top,desc,usage);if(c.aliases?.length){const aliases=document.createElement('div');aliases.className='aliases';aliases.textContent='Aliases: '+c.aliases.map(x=>'.'+x).join(', ');card.append(aliases)}grid.append(card)}subsection.append(sh,grid);section.append(subsection)}sections.append(section)}}
search.addEventListener('input',draw);fetch('/api/commands').then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{commands=data.commands||[];draw()}).catch(()=>{count.textContent='Unable to load commands';sections.textContent='Please try again later.'});
</script></body></html>
